name: Poll Oathsworn store

on:
  # Friday 18:30 UK time. GitHub cron is UTC, so both times are listed and the
  # scraper ignores whichever one isn't 18:30 in the UK that week (BST vs GMT).
  schedule:
    - cron: "30 17 * * 5"
    - cron: "30 18 * * 5"
  # "Run workflow" button = manual poll (limited to one per hour by the scraper).
  workflow_dispatch:
  # Redeploy the page when you change the site or this workflow.
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll-and-deploy
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape
        run: python scraper/scrape.py --trigger ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Store poll $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

  deploy:
    needs: poll
    if: always() && (needs.poll.result == 'success' || needs.poll.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the data commit made by the poll job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
